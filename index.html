<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriana Bassett | BYU Animation Computer Service Representative | Lighting and Pipeline Engineer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0a1128',
                            950: '#050814',
                        },
                        neonMaroon: {
                            DEFAULT: '#E32636',
                            hover: '#ff4d5e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-navy-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [formData, setFormData] = React.useState({ name: '', email: '', about: '' });
            const [statusMsg, setStatusMsg] = React.useState('');
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            
            // Carousel State with Images, Captions, and Clickable Links
            const slides = [
                { src: 'picone.png', caption: 'Watch Demo Reel', link: 'https://youtu.be/FwLy9o0BUnE' },
                { src: 'pictwo.png', caption: 'Watch Romeo and Julierat', link: 'https://byu.box.com/s/chq8x35ljnx5j5dw5jysd47pay0wqhjk' },
                { src: 'picthree.png', caption: null, link: null },
                { src: 'picfour.png', caption: null, link: null }
            ];
            
            const [currentIndex, setCurrentIndex] = React.useState(0);

            const prevImage = () => {
                setCurrentIndex((prev) => (prev === 0 ? slides.length - 1 : prev - 1));
            };

            const nextImage = () => {
                setCurrentIndex((prev) => (prev === slides.length - 1 ? 0 : prev + 1));
            };

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setStatusMsg('');

                try {
                    const response = await fetch('/api/submit-builder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        alert(`Thank you, ${formData.name}! Your information has been saved.`);
                        setFormData({ name: '', email: '', about: '' });
                        setIsModalOpen(false);
                    } else {
                        setStatusMsg(result.error || 'Failed to submit. Please try again.');
                    }
                } catch (err) {
                    setStatusMsg('An error occurred. Please try again later.');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const currentSlide = slides[currentIndex];

            return (
                <div className="flex flex-col min-h-screen justify-between">
                    {/* Header */}
                    <header className="flex justify-between items-center p-6 max-w-6xl mx-auto w-full border-b border-blue-900/40">
                        <h1 className="text-xl font-bold tracking-wider text-red-500">ADRIANA BASSETT</h1>
                        <nav className="space-x-6 text-sm text-slate-300">
                            <a href="#gallery" className="hover:text-red-400 transition-colors">Gallery</a>
                            <button 
                                onClick={() => setIsModalOpen(true)}
                                className="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg font-medium transition shadow-md hover:shadow-red-500/30"
                            >
                                Let's build tools together
                            </button>
                        </nav>
                    </header>

                    {/* Hero Section */}
                    <main className="max-w-4xl mx-auto text-center px-6 py-16 flex-grow flex flex-col justify-center items-center">
                        <h2 className="text-4xl md:text-5xl font-extrabold mb-6 tracking-tight leading-tight">
                            Lighting & Pipeline Engineer
                        </h2>
                        <p className="text-lg text-slate-300 mb-8 max-w-2xl leading-relaxed">
                            Technical Artist specializing in lighting pipelines, custom renders, and tool development for <span className="text-white font-semibold">Maya</span> and <span className="text-white font-semibold">Houdini</span>.
                        </p>
                        
                        {/* User Provided Buttons & Socials */}
                        <div className="flex flex-wrap items-center justify-center gap-4 mt-2">
                            <a href="https://youtu.be/36TnjMoK0kc" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded font-mono text-sm transition-all shadow-[0_0_15px_rgba(227,38,54,0.3)] hover:shadow-[0_0_20px_rgba(227,38,54,0.6)]">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                Watch Demo Reel
                            </a>
                            
                            <a 
                              href="/Resume_AdrianaBassett.pdf" 
                              download="Resume_AdrianaBassett.pdf"
                              target="_blank" 
                              rel="noopener noreferrer"
                              className="inline-flex items-center gap-2 px-6 py-3 border border-slate-700 bg-navy-900/60 text-slate-300 hover:text-white rounded font-mono text-sm transition-all hover:bg-blue-900/50 hover:border-blue-500"
                            >
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                              </svg>
                              Download Resume
                            </a>
                            
                            <div className="flex gap-5 text-slate-400 ml-2 md:ml-4">
                                <a href="https://github.com/adrianaabassett" target="_blank" rel="noopener noreferrer" className="hover:text-red-400 transition-colors p-2 bg-navy-900 rounded-full border border-slate-800 hover:border-red-500/50" aria-label="GitHub">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                                </a>
                                <a href="https://www.linkedin.com/in/adriana-bassett-a9922b26b" target="_blank" rel="noopener noreferrer" className="hover:text-red-400 transition-colors p-2 bg-navy-900 rounded-full border border-slate-800 hover:border-red-500/50" aria-label="LinkedIn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                                </a>
                            </div>
                        </div>
                    </main>

                    {/* Image Carousel Section */}
                    <section id="gallery" className="max-w-3xl mx-auto px-6 py-12 w-full">
                        <h3 className="text-xl font-bold mb-6 text-center text-slate-200">Featured Work & Pipeline Shots</h3>
                        <div className="relative bg-navy-900 rounded-xl border border-blue-900/60 overflow-hidden shadow-2xl flex items-center justify-center h-80 md:h-96 group">
                            
                            {/* Clickable Image (if link exists) */}
                            {currentSlide.link ? (
                                <a href={currentSlide.link} target="_blank" rel="noopener noreferrer" className="w-full h-full block cursor-pointer">
                                    <img 
                                        src={currentSlide.src} 
                                        alt={`Slide ${currentIndex + 1}`} 
                                        className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                                        onError={(e)=>{e.target.src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop"}}
                                    />
                                </a>
                            ) : (
                                <img 
                                    src={currentSlide.src} 
                                    alt={`Slide ${currentIndex + 1}`} 
                                    className="w-full h-full object-cover transition-all duration-300"
                                    onError={(e)=>{e.target.src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop"}}
                                />
                            )}
                            
                            {/* Left Arrow */}
                            <button 
                                onClick={prevImage}
                                className="absolute left-4 bg-navy-950/80 hover:bg-red-600 text-white p-3 rounded-full transition shadow-lg border border-slate-700 hover:border-red-500 z-10"
                                aria-label="Previous image"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </button>

                            {/* Right Arrow */}
                            <button 
                                onClick={nextImage}
                                className="absolute right-4 bg-navy-950/80 hover:bg-red-600 text-white p-3 rounded-full transition shadow-lg border border-slate-700 hover:border-red-500 z-10"
                                aria-label="Next image"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>

                            {/* Optional Caption Overlay */}
                            {currentSlide.caption && (
                                <div className="absolute top-4 bg-navy-950/85 backdrop-blur-sm px-4 py-2 rounded-lg border border-slate-700 shadow-md z-10">
                                    <a 
                                        href={currentSlide.link} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="text-red-400 hover:text-red-300 font-semibold underline underline-offset-4 transition-colors flex items-center gap-1.5 text-sm"
                                    >
                                        <span>{currentSlide.caption}</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                    </a>
                                </div>
                            )}

                            {/* Indicators */}
                            <div className="absolute bottom-4 flex gap-2 bg-navy-950/70 px-3 py-1.5 rounded-full border border-slate-800 z-10">
                                {slides.map((_, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => setCurrentIndex(idx)}
                                        className={`w-2.5 h-2.5 rounded-full transition ${currentIndex === idx ? 'bg-red-500 scale-110' : 'bg-slate-600 hover:bg-slate-400'}`}
                                        aria-label={`Go to slide ${idx + 1}`}
                                    ></button>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="text-center py-6 text-sm text-slate-500 border-t border-blue-900/40">
                        &copy; 2026 Adriana Bassett. All rights reserved.
                    </footer>

                    {/* React Modal Form */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                            <div className="bg-navy-900 rounded-xl p-8 max-w-md w-full relative shadow-2xl border border-blue-900/60">
                                {/* 'X' Close Button in the corner */}
                                <button 
                                    onClick={() => setIsModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold leading-none p-1 transition"
                                >
                                    &times;
                                </button>

                                <h3 className="text-2xl font-bold mb-6 text-red-500">Let's Build Tools Together</h3>
                                
                                {statusMsg && (
                                    <div className="mb-4 text-sm text-red-400 bg-red-950/50 border border-red-800 p-2 rounded">
                                        {statusMsg}
                                    </div>
                                )}

                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-1 text-slate-300">Name</label>
                                        <input 
                                            type="text" 
                                            name="name" 
                                            required 
                                            maxLength="100"
                                            value={formData.name}
                                            onChange={handleChange}
                                            className="w-full bg-navy-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500 transition"
                                            placeholder="Your Name"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1 text-slate-300">Email</label>
                                        <input 
                                            type="email" 
                                            name="email" 
                                            required 
                                            maxLength="150"
                                            value={formData.email}
                                            onChange={handleChange}
                                            className="w-full bg-navy-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500 transition"
                                            placeholder="your.email@example.com"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium mb-1 text-slate-300">A bit about you</label>
                                        <textarea 
                                            name="about" 
                                            rows="3"
                                            required
                                            maxLength="500"
                                            value={formData.about}
                                            onChange={handleChange}
                                            className="w-full bg-navy-950 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-red-500 transition"
                                            placeholder="Tell us about your background or project..."
                                        ></textarea>
                                    </div>

                                    {/* Enter Button on the bottom */}
                                    <div className="pt-2">
                                        <button 
                                            type="submit" 
                                            disabled={isSubmitting}
                                            className="w-full bg-red-600 hover:bg-red-500 disabled:bg-slate-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:shadow-red-500/30 transition"
                                        >
                                            {isSubmitting ? 'Saving...' : 'Enter'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
